name = "rm-boot-backend"
main = "dist/server.js" # Altere para apontar para o arquivo compilado
compatibility_date = "2026-03-28"
compatibility_flags = [ "nodejs_compat" ]

[build]
# O "|| exit 0" garante que, mesmo com avisos de TS, ele tente subir o que foi gerado
command = "npm install && npx tsc --skipLibCheck || echo 'Build concluído com avisos'"

[vars]
NODE_VERSION = "20"

[alias]
"sharp" = "node_modules/pino/browser.js"
"puppeteer" = "node_modules/pino/browser.js"
"fluent-ffmpeg" = "node_modules/pino/browser.js"
"@ffmpeg-installer/ffmpeg" = "node_modules/pino/browser.js"