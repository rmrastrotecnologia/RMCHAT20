name = "rm-boot-backend"
main = "dist/index.js"
compatibility_date = "2026-03-28"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm install && npm run build"
cwd = "."

[alias]
"sharp" = "node_modules/pino/browser.js"
"puppeteer" = "node_modules/pino/browser.js"
"fluent-ffmpeg" = "node_modules/pino/browser.js"
"@ffmpeg-installer/ffmpeg" = "node_modules/pino/browser.js"

[env.production]
name = "rm-boot-backend-prod"
routes = [
  { pattern = "api.rmboot.com.br/*", zone_id = "ZONE_ID_HERE" }
]

[env.development]
name = "rm-boot-backend-dev"
routes = [
  { pattern = "*.rmboot-dev.workers.dev/*" }
]

[triggers]
crons = ["0 */6 * * *"]

# Durable Objects
[[durable_objects.bindings]]
name = "WS_NAMESPACE"
class_name = "WebSocketDurableObject"
script_name = "rm-boot-backend"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "rmboot"
database_id = "DATABASE_ID_HERE"

# R2 Storage
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rmboot-files"
jurisdiction = "eu"

# Environment Variables (produção)
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
FRONTEND_URL = "https://app.rmboot.com.br"

# Environment Variables (desenvolvimento)
[env.development.vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"
FRONTEND_URL = "http://localhost:3000"

# Analytics Engine
[analytics]
enabled = true

# Secrets (configure no wrangler.toml local ou via wrangler secret)
# wrangler secret put JWT_SECRET --env production
# wrangler secret put DB_PASSWORD --env production

[remote_config]
max_ttl = 3600